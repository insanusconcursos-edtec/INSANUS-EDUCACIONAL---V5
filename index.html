<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insanus Educacional</title>
    <meta name="description" content="Gestão de Estudos de Alta Performance" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- ReactFlow CSS Injection (Correção de MIME Type) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reactflow@11.11.4/dist/style.css" />

    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Insanus">
    <link rel="apple-touch-icon" href="https://insanusconcursos.com/wp-content/uploads/2026/05/LOGO-MOBILE-2-INSANUS.png">
    <meta name="theme-color" content="#000000">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Service Worker Registration (Modo Ultra-Seguro)
      try {
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            // Limpeza preventiva de caches antigos
            if ('caches' in window) {
              caches.keys().then(names => {
                for (let name of names) caches.delete(name);
              }).catch(() => {});
            }

            navigator.serviceWorker.register('/sw.js')
              .then(reg => console.log('✅ PWA pronto'))
              .catch(() => {}); // Falha silenciosa
          });
        }
      } catch (e) {}

      // Help debug PWA installability
      window.addEventListener('beforeinstallprompt', (e) => {
        console.log('📱 App instalável');
      });

      window.addEventListener('appinstalled', () => {
        console.log('🎉 PWA instalado');
      });
    </script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                  black: '#000000',
                  dark: '#0a0a0a',
                  gray: '#121212',
                  'zinc-custom': '#1f1f1f',
                  red: '#ff0000',
                  'red-glow': '#ff0000',
                  'red-dark': '#800000'
              },
              border: "hsl(var(--border))",
              input: "hsl(var(--input))",
              ring: "hsl(var(--ring))",
              background: "#09090b", // zinc-950
              foreground: "#ffffff",
              primary: { DEFAULT: "#dc2626", foreground: "#ffffff" }, // red-600
              secondary: { DEFAULT: "#27272a", foreground: "#ffffff" }, // zinc-800
              destructive: { DEFAULT: "#ef4444", foreground: "#ffffff" },
              muted: { DEFAULT: "#27272a", foreground: "#a1a1aa" },
              accent: { DEFAULT: "#27272a", foreground: "#ffffff" },
              popover: { DEFAULT: "#09090b", foreground: "#ffffff" },
              card: { DEFAULT: "#18181b", foreground: "#ffffff" }, // zinc-900
            },
            fontFamily: {
                sans: ['Inter', 'sans-serif'],
                orbitron: ['Orbitron', 'sans-serif'],
            }
          },
        },
      }
    </script>
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #09090b; color: white; margin: 0; }
      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #000000; }
      ::-webkit-scrollbar-thumb { background: #1f1f1f; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #ff0000; }
      
      .grid-bg {
          background-image: linear-gradient(to right, #111111 1px, transparent 1px),
                            linear-gradient(to bottom, #111111 1px, transparent 1px);
          background-size: 40px 40px;
      }

      @keyframes highlight-pulse {
        0% { border-color: #dc2626; box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); }
        50% { border-color: #ff0000; box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); }
        100% { border-color: #dc2626; box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
      }
      .highlight-pulse {
        animation: highlight-pulse 1.5s ease-in-out infinite;
        border-width: 2px !important;
        z-index: 50;
      }

      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Styles for Rich Text Content (TipTap/Native) */
      .rich-content ul { list-style-type: disc !important; padding-left: 2rem !important; margin: 1rem 0 !important; color: white !important; }
      .rich-content ol { list-style-type: decimal !important; padding-left: 2rem !important; margin: 1rem 0 !important; color: white !important; }
      .rich-content li { margin-bottom: 0.5rem !important; display: list-item !important; color: white !important; }
      .rich-content li > p { display: inline !important; }
      .rich-content blockquote { border-left: 4px solid #4b5563; padding-left: 1rem; font-style: italic; color: #9ca3af; margin: 1rem 0; }

      /* Styles for Interactive Map / Lei Seca / Matrizes / Questões */
      .law-caput { margin-bottom: 0.5rem; line-height: 1.6; }
      .law-inciso { margin-left: 1.25rem; margin-bottom: 0.375rem; line-height: 1.5; }
      .law-alinea { margin-left: 2.25rem; margin-bottom: 0.25rem; line-height: 1.5; }
      .law-kw { font-weight: 800 !important; background: transparent !important; background-color: transparent !important; padding: 0 !important; border-radius: 0 !important; }
      .interactive-player-light .law-kw { color: #002060 !important; font-weight: 800 !important; background: transparent !important; background-color: transparent !important; }
      .interactive-player-dark .law-kw { color: #60a5fa !important; font-weight: 800 !important; background: transparent !important; background-color: transparent !important; }

      .interactive-player-light .matrix-kw { color: #002060 !important; font-weight: 700 !important; }
      .interactive-player-dark .matrix-kw { color: #93c5fd !important; font-weight: 700 !important; }

      .pega-a-visao-content {
        white-space: pre-line;
        line-height: 1.6;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .questions-nav-strip {
        display: flex;
        overflow-x: auto;
        scroll-behavior: smooth;
        padding-bottom: 6px;
        gap: 6px;
        scrollbar-width: thin;
      }
      .interactive-player-light .questions-nav-strip {
        scrollbar-color: #002060 #e2e8f0;
      }
      .interactive-player-dark .questions-nav-strip {
        scrollbar-color: #3b82f6 #141822;
      }
      .questions-nav-strip::-webkit-scrollbar {
        height: 6px;
      }
      .interactive-player-light .questions-nav-strip::-webkit-scrollbar-track {
        background: #e2e8f0;
        border-radius: 9999px;
      }
      .interactive-player-light .questions-nav-strip::-webkit-scrollbar-thumb {
        background-color: #002060;
        border-radius: 4px;
      }
      .interactive-player-dark .questions-nav-strip::-webkit-scrollbar-track {
        background: #141822;
        border-radius: 9999px;
      }
      .interactive-player-dark .questions-nav-strip::-webkit-scrollbar-thumb {
        background-color: #3b82f6;
        border-radius: 4px;
      }

      /* =====================================================================
         CORREÇÃO DE ROLAGEM INTEGRAL E REMOÇÃO DE OVERFLOW INTERNO EM QUESTÕES
         ===================================================================== */

      /* 1. Remove scroll interno e altura máxima do comando da questão */
      .q-enunciation,
      .question-statement,
      .enunciado-box {
        max-height: none !important;
        overflow-y: visible !important;
        white-space: pre-line !important;
        margin-bottom: 20px !important;
      }

      /* 2. Remove scroll interno e altura fixa das alternativas */
      .q-options,
      .question-options-container,
      .alternativas-box,
      .alternatives-container {
        max-height: none !important;
        height: auto !important;
        overflow-y: visible !important;
        flex: none !important;
        display: flex !important;
        flex-direction: column !important;
        gap: 12px !important;
      }

      /* 3. A rolagem lateral passa a ser exclusiva da página/área de visualização */
      #view-questions,
      .questions-view-container {
        overflow-y: auto !important;
        height: 100% !important;
        -webkit-overflow-scrolling: touch;
      }

      .interactive-player-light #view-questions::-webkit-scrollbar-track,
      .interactive-player-light .questions-view-container::-webkit-scrollbar-track {
        background: #e2e8f0;
      }
      .interactive-player-light #view-questions::-webkit-scrollbar-thumb,
      .interactive-player-light .questions-view-container::-webkit-scrollbar-thumb {
        background: #94a3b8;
        border-radius: 4px;
      }
      .interactive-player-light #view-questions::-webkit-scrollbar-thumb:hover,
      .interactive-player-light .questions-view-container::-webkit-scrollbar-thumb:hover {
        background: #002060;
      }

      /* 4. Coluna da questão com altura natural e coluna de gabarito fixa */
      .q-left-col {
        height: auto !important;
        min-height: auto !important;
        overflow: visible !important;
      }

      .q-right-col {
        height: auto !important;
        position: sticky !important;
        top: 10px !important;
      }

      /* =====================================================================
         INSPETOR DO MAPA MENTAL (CARDS DIDÁTICOS) & CHIPS DE QUESTÕES
         ===================================================================== */

      /* Card Teórico Pega a Visão no Inspetor Lateral */
      .insp-visao-box {
        background: #f0f7ff;
        border: 2px solid #0070c0;
        border-left: 6px solid #002060;
        border-radius: calc(12px * var(--insp-zoom, 1));
        padding: calc(14px * var(--insp-zoom, 1)) calc(18px * var(--insp-zoom, 1));
        margin-bottom: 12px;
      }
      .insp-visao-box .insp-card-title {
        color: #002060;
        font-weight: 800;
      }
      .interactive-player-dark .insp-visao-box {
        background: linear-gradient(135deg, rgba(23, 37, 84, 0.55), rgba(30, 27, 75, 0.35));
        border: 2px solid rgba(59, 130, 246, 0.5);
        border-left: 6px solid #3b82f6;
        color: #e5e7eb;
      }
      .interactive-player-dark .insp-visao-box .insp-card-title {
        color: #60a5fa;
      }

      /* Demais blocos semânticos do Inspetor Lateral */
      .insp-law-box {
        background: transparent;
        border: 2px dashed #7f7f7f;
        border-radius: calc(12px * var(--insp-zoom, 1));
        padding: calc(14px * var(--insp-zoom, 1)) calc(18px * var(--insp-zoom, 1));
        margin-bottom: 12px;
        font-style: italic;
      }
      .insp-law-box .insp-card-title {
        color: #002060;
        font-weight: 800;
        font-style: normal;
      }
      .interactive-player-dark .insp-law-box {
        background: #0b0e14;
        border: 1px dashed #374151;
        color: #e5e7eb;
      }
      .interactive-player-dark .insp-law-box .insp-card-title {
        color: #38bdf8;
      }

      .insp-list-box {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-left: 5px solid #10b981;
        border-radius: calc(12px * var(--insp-zoom, 1));
        padding: calc(14px * var(--insp-zoom, 1)) calc(18px * var(--insp-zoom, 1));
        margin-bottom: 12px;
      }
      .insp-list-box .insp-card-title {
        color: #047857;
        font-weight: 800;
      }
      .interactive-player-dark .insp-list-box {
        background: #121620;
        border: 1px solid #1f2937;
        border-left: 5px solid #10b981;
        color: #d1d5db;
      }
      .interactive-player-dark .insp-list-box .insp-card-title {
        color: #34d399;
      }

      .insp-example-box {
        background: #f0f9ff;
        border: 2px dashed #0070c0;
        border-radius: calc(12px * var(--insp-zoom, 1));
        padding: calc(14px * var(--insp-zoom, 1)) calc(18px * var(--insp-zoom, 1));
        margin-bottom: 12px;
      }
      .insp-example-box .insp-card-title {
        color: #0070c0;
        font-weight: 800;
      }
      .interactive-player-dark .insp-example-box {
        background: #12151c;
        border: 1px dashed rgba(147, 51, 234, 0.5);
        color: #d1d5db;
      }
      .interactive-player-dark .insp-example-box .insp-card-title {
        color: #c084fc;
      }

      .insp-alert-box {
        background: #fef2f2;
        border: 2px solid #c00000;
        border-radius: calc(12px * var(--insp-zoom, 1));
        padding: calc(14px * var(--insp-zoom, 1)) calc(18px * var(--insp-zoom, 1));
        margin-bottom: 12px;
      }
      .insp-alert-box .insp-card-title {
        color: #c00000;
        font-weight: 800;
      }
      .interactive-player-dark .insp-alert-box {
        background: rgba(69, 26, 3, 0.25);
        border: 1px solid rgba(180, 83, 9, 0.5);
        color: #fde68a;
      }
      .interactive-player-dark .insp-alert-box .insp-card-title {
        color: #fbbf24;
      }

      .insp-custom-box {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: calc(12px * var(--insp-zoom, 1));
        padding: calc(14px * var(--insp-zoom, 1)) calc(18px * var(--insp-zoom, 1));
        margin-bottom: 12px;
      }
      .insp-custom-box .insp-card-title {
        color: #002060;
        font-weight: 800;
      }
      .interactive-player-dark .insp-custom-box {
        background: #131620;
        border: 1px solid #1f2937;
        color: #d1d5db;
      }
      .interactive-player-dark .insp-custom-box .insp-card-title {
        color: #e5e7eb;
      }

      .insp-card-body p + p {
        margin-top: 8px;
      }
      .insp-card-body ul {
        list-style-type: disc;
        padding-left: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .insp-card-body ol {
        list-style-type: decimal;
        padding-left: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      /* Chips de Órgão, Cargo e Ano na Barra de Questões */
      .q-badge-chip {
        background: rgba(0, 112, 192, 0.08);
        color: #0070c0;
        border: 1px solid rgba(0, 112, 192, 0.25);
        font-size: 12px;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 7px;
        letter-spacing: 0.03em;
      }
      .interactive-player-dark .q-badge-chip {
        background: rgba(56, 189, 248, 0.12);
        color: #38bdf8;
        border-color: rgba(56, 189, 248, 0.3);
      }

      .q-badge-art {
        background: #fffbeb;
        color: #b45309;
        border: 1px solid #fde68a;
        font-size: 12px;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 7px;
        letter-spacing: 0.02em;
      }
      .interactive-player-dark .q-badge-art {
        background: rgba(120, 53, 15, 0.4);
        color: #fbbf24;
        border-color: rgba(180, 83, 9, 0.6);
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
